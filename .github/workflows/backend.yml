name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: nobody
      POSTGRES_PASSWORD: invalid
      POSTGRES_DB: nexus_ai_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "1"
      JWT_SECRET_KEY: ci-only-token-urlsafe-style-secret-9f3Kq2Lm
      ENVIRONMENT: test
      DEBUG: "false"
      AUTH_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: pytest unit (no postgres)
        run: python -m pytest -m "not integration"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: CHANGE_ME_LOCAL
          POSTGRES_DB: nexus_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_user -d nexus_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: CHANGE_ME_LOCAL
      POSTGRES_DB: nexus_ai_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ci-only-token-urlsafe-style-secret-9f3Kq2Lm
      ENVIRONMENT: test
      DEBUG: "false"
      AUTH_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: alembic upgrade
        run: python -m alembic upgrade head
      - name: alembic check
        run: python -m alembic check
      - name: pytest
        run: python -m pytest
