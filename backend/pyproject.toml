[project]
name = "nexus-ai-workspace-backend"
version = "0.1.0"
description = "Backend do Nexus AI Workspace (em desenvolvimento)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Dependências e scripts serão adicionados manualmente durante o estudo.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
