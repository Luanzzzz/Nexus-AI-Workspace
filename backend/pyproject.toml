[project]
name = "nexus-ai-workspace-backend"
version = "0.1.0"
description = "Backend API for Nexus AI Workspace"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3,<4",
    "alembic",
    "argon2-cffi",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "evals*", "tests*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that access a real PostgreSQL database; they must target nexus_ai_test",
]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
